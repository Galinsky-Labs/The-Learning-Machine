# Render Blueprint documenting the independent public hosting for The Learning Machine.
# The static site is the complete public learning experience; it needs no API, database or keys.
services:
  - type: web
    runtime: static
    name: the-learning-machine
    repo: https://github.com/Galinsky-Labs/The-Learning-Machine
    branch: main
    autoDeploy: true
    buildCommand: npx --yes pnpm@11.25.0 install --frozen-lockfile && npx --yes pnpm@11.25.0 build
    staticPublishPath: apps/web/dist
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; worker-src 'self' blob:; connect-src 'self' https://the-learning-machine-api.onrender.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Referrer-Policy
        value: "no-referrer"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
    envVars:
      - key: NODE_VERSION
        value: "24"

  # Optional private publisher API and opt-in tutor gateway. The static site never depends on it.
  - type: web
    runtime: node
    name: the-learning-machine-api
    repo: https://github.com/Galinsky-Labs/The-Learning-Machine
    branch: main
    plan: free
    region: ohio
    autoDeploy: true
    buildCommand: npx --yes pnpm@11.25.0 install --frozen-lockfile --filter @learning-machine/api...
    startCommand: cd apps/api && node src/migrate.mjs && node src/server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://the-learning-machine.onrender.com
      - key: DATABASE_URL          # Neon project "the-learning-machine", pooled host
        sync: false
      - key: DATABASE_URL_DIRECT   # Neon direct host, used for migrations
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_BOOTSTRAP_TOKEN # one-time creation of the first publisher account
        sync: false
      - key: ANTHROPIC_API_KEY     # optional; without it the tutor stays offline-only
        sync: false
